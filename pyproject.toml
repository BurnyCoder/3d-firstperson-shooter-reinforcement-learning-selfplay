[project]
name = "ministrike"
version = "0.1.0"
description = "An original 3D tactical shooter and reproducible multi-agent self-play experiment"
readme = "README.md"
authors = [
    { name = "Libor Burian" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy<3",
    "python-dotenv>=1.2.4",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "tensordict>=0.14.3,<0.15",
    "torch>=2.14.1",
    "torchrl>=0.14.1,<0.15",
    "ursina>=8.3.0",
]

[project.scripts]
csrl = "ministrike.app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

# Official CUDA wheels support this machine's Blackwell GPU; unrelated packages stay on PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
